name: tron

services:
  tron-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tron-api
    env_file: .env
    depends_on:
      - db
      - redis
      - qdrant
      - tron-kafka
    environment:
      ENVIRONMENT: local
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379
      QDRANT_DB_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP_SERVER: tron-kafka:19092
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    container_name: tron-postgres
    image: postgres:17
    restart: always
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data 
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    container_name: tron-adminer
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080

  pgadmin:
    container_name: tron-pgadmin
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - db
    ports:
      - 5050:80
    env_file: .env

  redis:
    container_name: tron-redis
    image: redis:8.2.2
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
  
  redis-commander:
    container_name: tron-redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    depends_on:
      - redis
    environment:
    - REDIS_HOSTS=local:redis:6379
    ports:
    - "8082:8081"
    user: redis

  qdrant:
    container_name: tron-qdrant
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - qdrant_data:/qdrant/storage

  tron-zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: tron-zookeeper
    container_name: tron-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: tron-zookeeper:2888:3888

  tron-kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: tron-kafka
    container_name: tron-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://tron-kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "tron-zookeeper:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - tron-zookeeper
    restart: always

  tron-kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: tron-kafka-ui
    ports:
      - 8081:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: tron-kafka:19092
    depends_on:
      - tron-kafka
      - tron-zookeeper

volumes:
  pgdata:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
